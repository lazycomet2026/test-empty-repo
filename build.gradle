buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // 使用 7.2.1 这个非常稳的插件版本
        classpath 'com.android.tools.build:gradle:7.2.1'
    }
}

apply plugin: 'com.android.application'

android {
    compileSdk 32

    defaultConfig {
        applicationId "com.only.github"
        minSdk 21
        targetSdk 32
        versionCode 1
        versionName "1.0"
    }
}
